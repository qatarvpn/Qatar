<style>
  :root{
    --maroon: #3a0d12;
    --maroon-deep: #240508;
    --maroon-soft: #55161d;
    --white: #ffffff;
    --cream: #fbf6f1;
    --gold: #eaa93f;
    --gold-deep: #c78a2d;
    --ink: #241110;
    --muted: #8a6f68;
    --line: rgba(36,17,16,0.1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    background:var(--white);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.7;
    overflow-x:hidden;
  }

  h1,h2,h3,.display{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    letter-spacing:0.5px;
  }

  a{color:inherit; text-decoration:none;}
  img,svg{display:block; max-width:100%;}

  .container{max-width:1160px; margin:0 auto; padding:0 32px;}

  :focus-visible{outline:2px solid var(--gold-deep); outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    max-width:1160px;
    margin:0 auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-size:15px;
    color:var(--maroon);
  }
  .brand svg{width:30px; height:32px;}
  .nav-links{display:flex; gap:32px; font-size:14px; color:var(--muted); font-weight:500;}
  .nav-links a:hover{color:var(--maroon);}
  .nav-cta{
    background:var(--maroon);
    color:var(--gold);
    padding:10px 22px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .nav-cta:hover{background:var(--maroon-deep); transform:translateY(-1px);}

  .nav-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

  @media (max-width:760px){ .nav-links{display:none;} }

  /* ---------- HERO (mirrors the app's own top card) ---------- */
  .hero{
    background:var(--maroon);
    border-radius:0 0 64px 64px;
    padding:72px 0 0;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(600px 300px at 15% 10%, rgba(234,169,63,0.10), transparent 60%),
      radial-gradient(500px 260px at 90% 20%, rgba(234,169,63,0.08), transparent 60%);
    pointer-events:none;
  }
  .hero-inner{
    position:relative;
    text-align:center;
    max-width:720px;
    margin:0 auto;
    padding:0 32px 56px;
  }
  .hero h1{
    color:var(--white);
    font-size:44px;
    line-height:1.35;
    margin-bottom:20px;
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }
  .hero h1 span{color:var(--gold);}
  @media (max-width:640px){ .hero h1{font-size:30px;} }

  .hero p.lead{
    color:rgba(255,255,255,0.72);
    font-size:17px;
    max-width:460px;
    margin:0 auto 32px;
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
    animation-delay:0.1s;
  }

  .hero-cta-row{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
    animation-delay:0.2s;
  }
  .btn-primary{
    background:var(--gold);
    color:var(--maroon-deep);
    padding:15px 30px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    display:inline-block;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover{background:#f4bb5e; transform:translateY(-2px);}
  .btn-ghost{
    border:1px solid rgba(255,255,255,0.3);
    color:var(--white);
    padding:15px 30px;
    border-radius:999px;
    font-weight:500;
    font-size:15px;
    display:inline-block;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .btn-ghost:hover{border-color:var(--gold); background:rgba(255,255,255,0.06);}

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* Phone mockup recreating the app's own screen */
  .phone-wrap{
    position:relative;
    display:flex; justify-content:center;
    padding:0 32px;
  }
  .phone-glow{
    position:absolute;
    width:320px; height:320px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,0.35), transparent 70%);
    filter:blur(10px);
    z-index:0;
    animation: glowPulse 3.2s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%, 100%{ opacity:0.5; transform:scale(0.94); }
    50%{ opacity:0.9; transform:scale(1.06); }
  }
  .phone{
    width:280px;
    background:var(--cream);
    border-radius:36px;
    border:6px solid var(--maroon-deep);
    box-shadow:0 30px 70px rgba(36,17,16,0.35);
    overflow:hidden;
    position:relative;
    z-index:1;
    opacity:0;
    transform:perspective(900px) rotateX(28deg) translateY(60px) scale(0.9);
    animation: phoneDrop 1.1s cubic-bezier(0.16,1,0.3,1) forwards, phoneFloat 4.5s ease-in-out 1.1s infinite;
    animation-delay:0.3s, 1.4s;
  }
  @keyframes phoneDrop{
    0%{ opacity:0; transform:perspective(900px) rotateX(28deg) translateY(60px) scale(0.9); }
    70%{ opacity:1; }
    100%{ opacity:1; transform:perspective(900px) rotateX(0deg) translateY(0) scale(1); }
  }
  @keyframes phoneFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  .phone-shine{
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform:skewX(-20deg);
    animation: shineSweep 3.6s ease-in-out 1.6s infinite;
    pointer-events:none;
  }
  @keyframes shineSweep{
    0%{ left:-60%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }
  .phone-screen-top{
    background:var(--maroon);
    padding:34px 20px 46px;
    text-align:center;
  }
  .phone-logo{
    color:var(--gold);
    font-size:22px;
    margin-bottom:34px;
    letter-spacing:1px;
  }
  .power-ring{
    position:relative;
    width:110px; height:110px;
    margin:0 auto;
    border-radius:50%;
    background:var(--white);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 0 rgba(234,169,63,0.5);
    animation: pulseRing 2.6s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(234,169,63,0.45); }
    70%{ box-shadow:0 0 0 22px rgba(234,169,63,0); }
    100%{ box-shadow:0 0 0 0 rgba(234,169,63,0); }
  }
  .power-ring svg{width:38px; height:38px;}
  .timer{
    color:var(--white);
    font-size:12px;
    letter-spacing:2px;
    margin-top:12px;
    font-variant-numeric:tabular-nums;
  }
  .phone-screen-bottom{
    background:var(--white);
    padding:22px 20px 30px;
    text-align:center;
  }
  .connected{
    font-size:11px;
    letter-spacing:3px;
    color:var(--muted);
    margin-bottom:16px;
  }
  .connected::before{
    content:"";
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    background:#4caf6d;
    margin-inline-end:8px;
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{ 50%{ opacity:0.35; } }

  .server-pill{
    border:1px solid var(--line);
    border-radius:999px;
    padding:11px 18px;
    font-size:13px;
    color:var(--ink);
    display:flex; align-items:center; justify-content:space-between;
    max-width:220px;
    margin:0 auto 14px;
  }
  .speed-row{
    display:flex; justify-content:center; gap:20px;
    font-size:12px;
    color:var(--muted);
  }

  /* ---------- STATS BAR ---------- */
  .stats-bar{
    display:flex;
    justify-content:center;
    gap:56px;
    flex-wrap:wrap;
    padding:44px 32px 68px;
    position:relative;
  }
  .stat{ text-align:center; color:var(--white); }
  .stat b{
    font-family:'Bungee', sans-serif;
    font-size:30px;
    color:var(--gold);
    display:block;
  }
  .stat span{ font-size:13px; color:rgba(255,255,255,0.65); }

  /* ---------- SECTIONS ---------- */
  .section{ padding:100px 0; }
  .section-head{ max-width:560px; margin-bottom:60px; }
  .section-head h2{ font-size:28px; color:var(--maroon); margin-bottom:16px; line-height:1.5; }
  .section-head p{ color:var(--muted); font-size:16px; }

  /* ---------- FEATURES ---------- */
  .feature-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:56px;
    align-items:center;
    padding:52px 0;
    border-bottom:1px solid var(--line);
    opacity:0;
    transform:translateY(24px);
    transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  .feature-row.in-view{ opacity:1; transform:translateY(0); }
  .feature-row:last-child{ border-bottom:none; }
  .feature-row:nth-child(even) .feature-text{ order:2; }
  .feature-row:nth-child(even) .feature-art{ order:1; }

  @media (max-width:820px){
    .feature-row{ grid-template-columns:1fr; gap:28px; }
    .feature-row:nth-child(even) .feature-text{ order:1; }
    .feature-row:nth-child(even) .feature-art{ order:2; }
  }

  .feature-text{ border-left:3px solid var(--gold); padding-left:24px; }
  .feature-row:nth-child(even) .feature-text{ border-left:none; border-right:3px solid var(--gold); padding-left:0; padding-right:24px; }
  .feature-text h3{ font-size:19px; color:var(--maroon); margin-bottom:12px; line-height:1.5; }
  .feature-text p{ color:var(--muted); font-size:15px; max-width:380px; }

  .feature-art{
    background:var(--maroon);
    border-radius:24px;
    height:230px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .feature-art::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(220px 140px at 50% 40%, rgba(234,169,63,0.14), transparent 70%);
  }
  .feature-art svg{ width:76px; height:76px; position:relative; z-index:1; }

  /* ---------- SPEED SECTION ---------- */
  .speed-section{
    background:var(--maroon);
    border-radius:28px;
    padding:60px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:44px;
    align-items:center;
  }
  @media (max-width:820px){ .speed-section{ grid-template-columns:1fr; padding:40px 26px; text-align:center; } }
  .speed-section h2{ color:var(--white); font-size:26px; margin-bottom:16px; line-height:1.5; }
  .speed-section p{ color:rgba(255,255,255,0.68); font-size:15px; }

  .servers-strip{ display:flex; gap:12px; flex-wrap:wrap; margin-top:32px; justify-content:flex-start; }
  @media (max-width:820px){ .servers-strip{ justify-content:center; } }
  .server-chip{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:999px;
    padding:9px 18px;
    font-size:13px;
    color:rgba(255,255,255,0.8);
  }

  .speed-dial{
    background:var(--cream);
    border-radius:20px;
    padding:38px;
    text-align:center;
  }
  .speed-number{
    font-family:'Bungee', sans-serif;
    font-size:56px;
    color:var(--maroon);
    line-height:1;
  }
  .speed-unit{ color:var(--muted); font-size:13px; margin-top:10px; }
  .speed-meta{
    display:flex; justify-content:space-around;
    margin-top:26px; padding-top:22px;
    border-top:1px solid var(--line);
  }
  .speed-meta div span{ display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
  .speed-meta div b{ font-family:'Bungee', sans-serif; font-size:16px; color:var(--maroon); }

  /* ---------- PLAY STORE SEARCH DEMO (inside hero phone) ---------- */
  .phone-stage{ position:relative; width:100%; aspect-ratio:9/19.3; }
  .phone-face{
    position:absolute; inset:0;
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .phone-face.visible{ opacity:1; transform:translateY(0); }
  .store-face{ background:var(--cream); display:flex; flex-direction:column; z-index:2; }
  .app-face{ z-index:1; }
  .app-screen-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity 0.7s ease;
  }
  .app-screen-img.visible{ opacity:1; }
  .app-tap-cursor{
    position:absolute; top:0; left:0;
    width:30px; height:30px;
    opacity:0;
    pointer-events:none;
    transition:transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
    filter:drop-shadow(0 6px 10px rgba(36,17,16,0.35));
    z-index:3;
  }
  .app-tap-cursor.visible{ opacity:1; }
  .app-tap-cursor svg{ position:relative; z-index:1; }
  .app-tap-cursor .play-tap-ring{
    position:absolute; inset:0;
    border-radius:50%;
    background:rgba(234,169,63,0.5);
    transform:scale(0);
    opacity:0;
  }
  .app-tap-cursor.tap .play-tap-ring{ animation:tapRing 0.5s ease-out; }
  .app-tap-cursor.tap svg{ animation:tapShrink 0.5s ease-out; }

  .store-topbar{
    display:flex; align-items:center; gap:8px;
    background:var(--maroon);
    color:var(--white);
    font-size:11px; font-weight:600;
    padding:12px 16px;
  }
  .store-screen{ padding:16px 14px 20px; position:relative; flex:1; }

  .play-search-bar{
    display:flex; align-items:center; gap:8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 14px;
    box-shadow:0 8px 20px rgba(36,17,16,0.06);
    transition:border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .play-search-bar.focused{
    border-color:var(--gold-deep);
    box-shadow:0 0 0 3px rgba(234,169,63,0.18), 0 8px 20px rgba(36,17,16,0.08);
  }
  .play-search-text-wrap{ position:relative; flex:1; font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; }
  .play-placeholder{ color:var(--muted); }
  .play-placeholder.hide{ display:none; }
  .play-caret{
    display:inline-block; width:1px; height:12px;
    background:var(--ink); margin-inline-start:2px;
    vertical-align:-2px;
    animation:blink 0.9s step-end infinite;
  }

  .play-result-card{
    display:flex; align-items:center; gap:10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-top:14px;
    box-shadow:0 10px 26px rgba(36,17,16,0.07);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .play-result-card.show{ opacity:1; transform:translateY(0); }
  .play-result-icon{ width:38px; height:38px; border-radius:10px; flex-shrink:0; }
  .play-result-info{ flex:1; min-width:0; }
  .play-result-name{ font-weight:700; font-size:12px; color:var(--ink); }
  .play-result-meta{ font-size:10px; color:var(--muted); margin-top:2px; }
  .play-rating{ color:var(--gold-deep); font-weight:600; }
  .play-install-btn{
    border:none; cursor:default;
    background:var(--maroon);
    color:var(--gold);
    font-size:10px; font-weight:700;
    padding:7px 13px;
    border-radius:999px;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    transition:background 0.3s ease, color 0.3s ease;
  }
  .play-install-btn.installed{ background:#2f7d4f; color:#fff; }
  .play-install-btn .install-fill{
    position:absolute; inset:0;
    background:rgba(234,169,63,0.32);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform 0.95s linear;
  }
  .play-install-btn.installing .install-fill{ transform:scaleX(1); }
  .play-install-btn span{ position:relative; z-index:1; }

  .play-rate-card{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-top:14px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .play-rate-card.show{ opacity:1; transform:translateY(0); }
  .play-rate-label{ font-size:11px; font-weight:600; color:var(--muted); }
  .play-stars{ display:flex; gap:5px; }
  .play-star{
    width:19px; height:19px;
    fill:none; stroke:var(--line); stroke-width:1.4;
    transform-box:fill-box;
    transform-origin:50% 50%;
    transition:fill 0.2s ease, stroke 0.2s ease;
  }
  .play-star.filled{
    fill:var(--gold-deep); stroke:var(--gold-deep);
    animation:starPop 0.35s ease;
  }
  @keyframes starPop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.35); }
    100%{ transform:scale(1); }
  }

  .play-cursor{
    position:absolute; top:0; left:0;
    width:30px; height:30px;
    opacity:0;
    pointer-events:none;
    transition:transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
    filter:drop-shadow(0 6px 10px rgba(36,17,16,0.35));
    z-index:3;
  }
  .play-cursor.visible{ opacity:1; }
  .play-cursor svg{ position:relative; z-index:1; }
  .play-tap-ring{
    position:absolute; inset:0;
    border-radius:50%;
    background:rgba(234,169,63,0.5);
    transform:scale(0);
    opacity:0;
  }
  .play-cursor.tap .play-tap-ring{ animation:tapRing 0.5s ease-out; }
  .play-cursor.tap svg{ animation:tapShrink 0.5s ease-out; }
  @keyframes tapRing{
    0%{ transform:scale(0.3); opacity:0.7; }
    100%{ transform:scale(2.2); opacity:0; }
  }
  @keyframes tapShrink{
    0%,100%{ transform:scale(1); }
    40%{ transform:scale(0.82); }
  }

  .playdemo-replay{
    display:flex; align-items:center; gap:7px;
    justify-content:center;
    margin:18px auto 0;
    width:fit-content;
    border:1px solid rgba(255,255,255,0.25);
    background:transparent;
    color:rgba(255,255,255,0.7);
    font-family:'Inter', sans-serif;
    font-size:12px; font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    position:relative;
    z-index:3;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .playdemo-replay:hover{ border-color:var(--gold); color:var(--gold); }

  /* ---------- FINAL CTA ---------- */
  .final-cta{
    background:var(--maroon);
    border-radius:64px 64px 0 0;
    text-align:center;
    padding:100px 32px 90px;
    color:var(--white);
  }
  .final-cta h2{ font-size:32px; max-width:600px; margin:0 auto 18px; line-height:1.5; }
  .final-cta h2 span{ color:var(--gold); }
  .final-cta p{ color:rgba(255,255,255,0.68); font-size:16px; margin-bottom:36px; }

  footer{ padding:36px 0; }

  /* ---------- NETWORK MAP ---------- */
  .map-panel{
    background:var(--maroon);
    border-radius:28px;
    padding:36px 16px;
    position:relative;
    overflow:hidden;
  }
  .map-panel::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(500px 260px at 30% 20%, rgba(234,169,63,0.10), transparent 65%);
    pointer-events:none;
    z-index:2;
  }
  .map-stage{
    position:relative;
    width:100%;
    aspect-ratio:1000/480;
  }
  .map-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    opacity:0.9;
  }
  .world-map{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    z-index:1;
  }

  .map-dot{ fill:rgba(255,255,255,0.28); }

  .conn-line{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.4;
    stroke-dasharray:5 7;
    opacity:0.75;
    animation:dashFlow 1.6s linear infinite;
  }
  @keyframes dashFlow{ to{ stroke-dashoffset:-24; } }

  .travel-dot{
    fill:#fff;
    filter:drop-shadow(0 0 5px var(--gold));
  }

  .server-node{ fill:var(--gold); }
  .server-ping{
    fill:none;
    stroke:var(--gold);
    stroke-width:2;
    opacity:0.85;
    transform-box:fill-box;
    transform-origin:center;
    animation:pingRing 2.4s ease-out infinite;
  }
  @keyframes pingRing{
    0%{ transform:scale(1); opacity:0.85; }
    100%{ transform:scale(3.2); opacity:0; }
  }

  .you-node{ fill:#ffffff; stroke:var(--maroon-deep); stroke-width:2; }
  .you-ping{
    fill:none;
    stroke:#ffffff;
    stroke-width:2;
    opacity:0.9;
    transform-box:fill-box;
    transform-origin:center;
    animation:pingRing 2.2s ease-out infinite;
  }

  .node-label{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    fill:rgba(255,255,255,0.85);
  }
  .you-label{ fill:var(--gold); font-weight:700; }
  .footer-row{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:14px;
    color:var(--muted); font-size:13px;
  }
  .footer-links{ display:flex; align-items:center; gap:20px; }
  .footer-links a, .footer-links button{
    background:none; border:none; padding:0; cursor:pointer;
    font-family:'Inter', sans-serif;
    color:var(--muted); font-size:13px; font-weight:600;
    text-decoration:none;
    transition:color 0.15s ease;
  }
  .footer-links a:hover, .footer-links button:hover{ color:var(--maroon); }

  /* ---------- PRIVACY POLICY MODAL ---------- */
  .privacy-modal{
    display:none;
    position:fixed; inset:0;
    z-index:999;
    align-items:center; justify-content:center;
    padding:20px;
  }
  .privacy-modal.open{ display:flex; }
  .privacy-backdrop{
    position:absolute; inset:0;
    background:rgba(36,17,16,0.55);
  }
  .privacy-panel{
    position:relative;
    background:#fff;
    width:min(640px,100%);
    max-height:85vh;
    overflow-y:auto;
    border-radius:24px;
    padding:36px 30px 30px;
    box-shadow:0 40px 90px rgba(36,17,16,0.35);
  }
  .privacy-close{
    position:absolute; top:16px; inset-inline-end:16px;
    width:34px; height:34px;
    border:none; border-radius:50%;
    background:rgba(67,11,23,0.06);
    color:var(--maroon);
    font-size:22px; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s ease;
  }
  .privacy-close:hover{ background:rgba(67,11,23,0.12); }
  .privacy-content h2{
    font-family:'Bungee', sans-serif;
    font-size:22px; color:var(--maroon);
    margin-bottom:8px;
    display:flex; align-items:center; gap:10px;
  }
  .privacy-sub{ color:var(--muted); font-size:14px; margin-bottom:26px; }
  .privacy-section{ margin-bottom:22px; }
  .privacy-section h3{
    font-size:15px; font-weight:800; color:var(--ink);
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .pp-emoji{ font-size:16px; }
  .privacy-section p{ font-size:13.5px; line-height:1.7; color:var(--muted); }
  .privacy-section ul{ margin:8px 0 0; padding-inline-start:20px; }
  .privacy-section li{ font-size:13.5px; line-height:1.8; color:var(--muted); }
  .privacy-email{ margin-top:10px; font-weight:700; color:var(--ink); }
  .privacy-email a{ color:var(--maroon); text-decoration:none; }
  .privacy-email a:hover{ text-decoration:underline; }
  .privacy-updated{ margin-top:14px; font-size:12px; color:var(--muted); opacity:0.75; }
  @media(max-width:520px){
    .privacy-panel{ padding:28px 20px 24px; border-radius:20px; }
    .privacy-content h2{ font-size:19px; }
  }

/* ===== PREMIUM V2 OVERRIDES ===== */
:root{
  --maroon:#430b17;
  --maroon-deep:#21050b;
  --maroon-soft:#68152a;
  --gold:#f0b84b;
  --gold-deep:#c98d28;
  --cream:#fbf7f2;
  --ink:#241014;
  --muted:#7f6867;
  --line:rgba(67,11,23,.10);
}
body{background:#fff;}
header{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(36,10,16,.04);}
.brand{font-weight:800;letter-spacing:.7px;}
.nav-cta,.btn-primary{box-shadow:0 12px 28px rgba(67,11,23,.18);}
.hero{
  min-height:720px;
  border-radius:0 0 72px 72px;
  padding-top:82px;
  background:
    radial-gradient(circle at 50% 76%,rgba(240,184,75,.12),transparent 27%),
    linear-gradient(145deg,#4b0d1b 0%,#350812 58%,#26050b 100%);
}
.hero::after{
  content:"";
  position:absolute;
  width:900px;height:420px;
  left:50%;bottom:70px;
  transform:translateX(-50%);
  background-image:url("https://raw.githubusercontent.com/qatarvpn/mynewfek/refs/heads/main/file_0000000002c481f4b0c905f2bb121702.png");
  background-size:contain;background-position:center;background-repeat:no-repeat;
  opacity:.055;filter:contrast(1.15);
  pointer-events:none;
}
.hero-inner{z-index:3;}
.hero h1{font-size:clamp(34px,5vw,56px);letter-spacing:1px;text-shadow:0 8px 30px rgba(0,0,0,.18);}
.hero p.lead{font-size:17px;max-width:540px;}
.phone-wrap{z-index:3;}
.phone{
  width:min(300px,78vw);
  border-radius:42px;
  border:7px solid #19040a;
  box-shadow:0 38px 100px rgba(0,0,0,.42),0 0 70px rgba(240,184,75,.10);
}
.phone-glow{width:430px;height:430px;background:radial-gradient(circle,rgba(240,184,75,.24),transparent 68%);}
.stats-bar{z-index:4;gap:0;max-width:850px;margin:0 auto;padding-top:42px;}
.stat{flex:1;min-width:150px;border-right:1px solid rgba(255,255,255,.13);}
.stat:last-child{border-right:0;}
.stat b{font-size:27px;}
.section{padding:110px 0;}
.section-head{max-width:650px;}
.section-head h2{font-size:32px;}
.feature-row{
  border:0;
  padding:34px 0;
  gap:70px;
}
.feature-text{
  background:linear-gradient(180deg,#fff,#fffaf6);
  border:1px solid rgba(67,11,23,.07);
  border-left:3px solid var(--gold);
  border-radius:0 24px 24px 0;
  padding:30px;
  box-shadow:0 18px 50px rgba(67,11,23,.06);
}
.feature-row:nth-child(even) .feature-text{
  border-right:3px solid var(--gold);
  border-left:1px solid rgba(67,11,23,.07);
  border-radius:24px 0 0 24px;
  padding:30px;
}
.feature-text h3{font-size:21px;}
.feature-art{
  height:270px;
  border-radius:30px;
  background:
    radial-gradient(circle at 50% 50%,rgba(240,184,75,.13),transparent 45%),
    linear-gradient(145deg,#4b0d1b,#26050b);
  box-shadow:0 25px 60px rgba(67,11,23,.14);
}
.feature-art svg{width:92px;height:92px;filter:drop-shadow(0 0 14px rgba(240,184,75,.25));}
.map-panel{
  border-radius:34px;
  padding:28px 18px;
  background:
    radial-gradient(circle at 50% 45%,rgba(240,184,75,.09),transparent 48%),
    linear-gradient(145deg,#4b0d1b,#24050a);
  box-shadow:0 30px 70px rgba(67,11,23,.16);
}
.map-bg{opacity:.92;filter:drop-shadow(0 0 8px rgba(255,255,255,.04));}
.speed-section{
  border-radius:34px;
  background:
    radial-gradient(circle at 10% 20%,rgba(240,184,75,.12),transparent 35%),
    linear-gradient(145deg,#4b0d1b,#25050b);
  box-shadow:0 30px 70px rgba(67,11,23,.16);
}
.speed-dial{
  border:1px solid rgba(67,11,23,.06);
  box-shadow:0 20px 50px rgba(0,0,0,.15);
}
.speed-number{font-size:62px;}
.server-chip{transition:transform .2s ease,border-color .2s ease,background .2s ease;}
.server-chip:hover{transform:translateY(-2px);border-color:rgba(240,184,75,.55);background:rgba(255,255,255,.12);}
.final-cta{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(240,184,75,.13),transparent 40%),
    linear-gradient(145deg,#4b0d1b,#25050b);
}
.final-cta::before{
  content:"";
  position:absolute;inset:0;
  background-image:url("https://raw.githubusercontent.com/qatarvpn/mynewfek/refs/heads/main/file_0000000002c481f4b0c905f2bb121702.png");
  background-size:900px auto;background-position:center;background-repeat:no-repeat;
  opacity:.035;pointer-events:none;
}
.final-cta>*{position:relative;z-index:1;}
footer{background:#fff;}
footer .footer-row{padding-top:10px;}
@media(max-width:820px){
  .hero{min-height:650px;padding-top:58px;}
  .stats-bar{gap:18px;}
  .stat{border-right:0;min-width:120px;}
  .section{padding:80px 0;}
  .section-head h2{font-size:27px;}
  .feature-row{gap:22px;}
  .feature-text,.feature-row:nth-child(even) .feature-text{padding:24px;border-radius:22px;border-left:3px solid var(--gold);border-right:1px solid rgba(67,11,23,.07);}
  .feature-art{height:210px;}
  .speed-number{font-size:50px;}
}
@media(max-width:520px){
  .container{padding:0 20px;}
  .nav{padding:12px 20px; flex-wrap:wrap; row-gap:10px;}
  .brand{ white-space:nowrap; font-size:14px; }
  .nav-right{ width:100%; justify-content:space-between; }
  .lang-toggle button{ padding:6px 11px; font-size:11px; }
  .nav-cta{ padding:8px 16px; font-size:13px; }
  .hero{border-radius:0 0 42px 42px;}
  .hero-inner{padding-left:20px;padding-right:20px;}
  .hero h1{font-size:31px;}
  .hero p.lead{font-size:15px;}
  .btn-primary,.btn-ghost{padding:13px 22px;font-size:14px;}
  .stats-bar{padding:34px 15px 48px;}
  .stat b{font-size:23px;}
  .stat span{font-size:11px;}
  .map-panel{padding:18px 8px;border-radius:24px;}
  .speed-section{padding:32px 20px;border-radius:26px;}
  .final-cta{border-radius:42px 42px 0 0;padding:78px 22px 70px;}
}

@media(max-width:600px){.section div[style*='grid-template-columns:repeat(3,1fr)']{grid-template-columns:1fr!important;}}

/* ---------- LANGUAGE TOGGLE ---------- */
html[lang="ar"] body{ font-family:'Tajawal', sans-serif; }
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] .display{ font-family:'Tajawal', sans-serif; font-weight:700; letter-spacing:0; }
html[lang="ar"] .brand{ letter-spacing:0; }

.lang-toggle{
  display:flex; align-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  margin-inline-end:14px;
  background:rgba(67,11,23,0.04);
}
.lang-toggle button{
  border:none; background:transparent; cursor:pointer;
  font-family:'Inter', sans-serif;
  font-size:12px; font-weight:700;
  padding:7px 14px; border-radius:999px;
  color:var(--muted);
  transition:background 0.15s ease, color 0.15s ease;
}
html[lang="ar"] .lang-toggle button{ font-family:'Tajawal', sans-serif; }
.lang-toggle button.active{ background:var(--maroon); color:var(--gold); }
@media (max-width:760px){ .lang-toggle{ margin-inline-end:0; } }
</style>
